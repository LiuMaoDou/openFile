name: Check FileM
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Native Windows and Everything smoke
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $filemScratch = Join-Path $env:RUNNER_TEMP ("filem-everything-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $filemScratch | Out-Null
          $filemZip = Join-Path $filemScratch 'Everything.zip'
          Invoke-WebRequest 'https://www.voidtools.com/Everything-1.4.1.1032.x64.zip' -OutFile $filemZip
          if ((Get-FileHash $filemZip -Algorithm SHA256).Hash -ne '698df475ec44e638f66f1b6a32d28fea613cec78d3b6310e6abe53431eeb940c') {
            throw 'Everything download checksum mismatch'
          }
          Expand-Archive $filemZip -DestinationPath $filemScratch
          $env:FILEM_EVERYTHING_EXE = Join-Path $filemScratch 'Everything.exe'
          node scripts/cargo.mjs run --locked -p filem-core --example windows_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows smoke failed' }
      - name: Native content extraction smoke
        run: node scripts/cargo.mjs run --locked -p filem-core --example content_smoke
      - run: npm run check:rust
      - run: node scripts/cargo.mjs fmt --all -- --check
      - run: node scripts/cargo.mjs clippy --workspace --all-targets -- -D warnings
