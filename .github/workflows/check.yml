name: Check FileM
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:rust
      - run: node scripts/cargo.mjs fmt --all -- --check
      - run: node scripts/cargo.mjs clippy --workspace --all-targets -- -D warnings
